<!DOCTYPE html>
<html>

<head>

<title>FD vs Mutual Fund</title>

<style>

body{
    font-family:'Segoe UI';
    margin:0;
    background:#F5F7FA;
    color:#334155;
}

.header{
    background:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.05);
}

.logo{
    height:45px;
}

.nav a{
    margin:0 15px;
    text-decoration:none;
    color:#334155;
    font-weight:500;
}

.hero{
    text-align:center;
    margin-top:60px;
}

.hero h1{
    font-size:42px;
}

.highlight{
    color:#2FA4A9;
}

.card{
    background:white;
    width:430px;
    margin:40px auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

input, select{
    width:95%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    background:#2FA4A9;
    color:white;
    padding:14px;
    border:none;
    border-radius:10px;
    width:100%;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#248b8f;
}

.footer{
    background:white;
    margin-top:50px;
    text-align:center;
    padding:30px;
}

</style>

</head>

<body>

<div class="header">

<img src="/static/logo.png" class="logo">

<a href="#">Home</a>
<a href="#">About</a>
<a href="#contact">Contact</a>
</div>

</div>

<div class="hero">

<h1>
See your money grow
<span class="highlight">smarter</span> 💸
</h1>

<p>
Compare FD vs Mutual Funds instantly
</p>

</div>

<div class="card">

<form action="/result" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="number" name="phone" placeholder="Phone Number" required>

<input type="number" name="amount" placeholder="Investment Amount (₹)" required>

<input type="number" step="0.1" name="rate" placeholder="FD Interest Rate (%)" required>

<input type="number" name="years" placeholder="Investment Duration (Years)" required>

<select name="risk" required>

<option value="">Select Strategy</option>

<option value="low">
Conservative (10%)
</option>

<option value="medium">
Moderate (12%)
</option>

<option value="high">
Aggressive (14%)
</option>

<option value="sage">
Sagefarm (20%)
</option>

</select>

<button type="submit">
Compare Now 🚀
</button>

</form>

</div>

<div id="contact" class="footer">

<h2>Contact Us</h2>

<p>📞 8433726774</p>

<p>📧 invest@sagefarm.in</p>

<a href="https://wa.me/918433726774">

<button style="background:#25D366;width:250px;">
Chat on WhatsApp 💬
</button>

</a>

</html>
